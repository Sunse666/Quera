settings:
  hotkey: Alt+Space
  width: 680
  opacity: 96
  max_results: 30
  autostart: false
  hide_on_deactivate: true
  hide_delay_ms: 200
  show_on_startup: false

colors:
  background: "#B216213E"
  search_card: "#0DFFFFFF"
  search_border: "#12FFFFFF"
  result_card: "#CC1A1A2E"
  result_border: "#33FFFFFF"
  result_hover: "#18FFFFFF"
  result_selected_start: "#D97035"
  result_selected_end: "#E8955A"
  text_primary: "#FFFFFF"
  text_secondary: "#8899AA"
  text_muted: "#556677"
  accent: "#D97035"

search:
  match_mode: contains
  include_directories: false
  max_depth: -1

exclude:
  paths:
    - ~/AppData
    - ~/.git
  patterns:
    - "*.tmp"
    - "*.log"

cache:
  enabled: true
  refresh_on_start: true
  max_files: 50000

ui:
  border_radius: 20
  font_family: "Microsoft YaHei UI"
  font_size_search: 17
  font_size_result_name: 14
  font_size_result_desc: 11
  item_height: 44
  show_icons: true
  show_type_badge: true
  show_status_bar: true

terminal:
  default: cmd
  admin_default: powershell

paths:
  - ~/Desktop
  - C:/Program Files (x86)
  - D:/Tools

file_types:
  - .exe
  - .lnk
  - .bat
  - .ps1

commands:
  - keyword: cmd
    name: 命令提示符
    action: run:cmd.exe
    icon: "⚡"
    admin: false

bookmarks:
  - keyword: gh
    name: GitHub
    url: https://github.com
    icon: "🔗"

folders:
  - keyword: desk
    name: 桌面
    path: ~/Desktop
    icon: "📁"

search_engines:
  - keyword: g
    name: Google
    url: https://www.google.com/search?q={query}
    icon: "🔍"

priority:
  types:
    - command
    - bookmark
    - file
    - folder
    - search
    - search_hint
  extensions:
    - .exe
    - .lnk
    - .bat
    - .ps1
  custom_path_first: true
