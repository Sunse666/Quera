settings:
  hotkey: Alt+Space
  width: 480
  opacity: 96
  max_results: 30
  autostart: false
  hide_on_deactivate: true
  hide_delay_ms: 200
  show_on_startup: false

window:
  always_on_top: true
  corner_radius: 20

icons:
  enable_image_icons: true
  cache_icons: true

colors:
  background: "#B216213E"
  search_card: "#0DFFFFFF"
  search_border: "#12FFFFFF"
  result_card: "#CC1A1A2E"
  result_border: "#33FFFFFF"
  result_hover: "#18FFFFFF"
  result_selected_start: "#D97035"
  result_selected_end: "#E8955A"
  text_primary: "#FFFFFF"
  text_secondary: "#8899AA"
  text_muted: "#556677"
  accent: "#D97035"

search_box:
  placeholder: ""
  icon: ""
  esc_hint: ""

results:
  padding_h: 10
  padding_v: 7
  margin: 1
  icon_size: 20
  badge_font_size: 9

layout:
  outer_margin: 12
  card_gap: 10
  search_padding: 14
  results_padding: 6

shortcuts:
  next_page: Tab
  prev_page: Shift+Tab
  execute: Enter
  hide: Escape
  open_config: "Ctrl+,"
  reload_config: Ctrl+R

search:
  match_mode: contains
  include_directories: false
  max_depth: -1

exclude:
  paths:
    - ~/AppData
    - ~/.git
  patterns:
    - "*.tmp"
    - "*.log"

cache:
  enabled: true
  refresh_on_start: true
  max_files: 50000

ui:
  border_radius: 20
  font_family: "Microsoft YaHei UI"
  font_size_search: 17
  font_size_result_name: 14
  font_size_result_desc: 11
  max_visible_items: 10
  item_height: 44
  show_icons: true
  show_type_badge: true
  show_status_bar: true

terminal:
  default: cmd
  admin_default: powershell

paths:
  - ~/Desktop
  - D:/Tools

file_types:
  - .exe
  - .lnk
  - .bat
  - .ps1

commands:
  - keyword: cmd
    name: 命令提示符
    action: run:cmd.exe
    icon: "⚡"
    admin: false

bookmarks:
  - keyword: gh
    name: GitHub
    url: https://github.com
    icon: "🔗"

folders:
  - keyword: desk
    name: 桌面
    path: ~/Desktop
    icon: "📁"

search_engines:
  - keyword: shg
    name: Google
    url: https://www.google.com/search?q={query}
    icon: "🔍"

priority:
  types:
    - bookmark
    - file
    - command
    - folder
    - search
    - search_hint
  extensions:
    - .lnk
    - .exe
    - .bat
    - .ps1
  custom_path_first: true
