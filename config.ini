[settings]
hotkey=Alt+Space
width=680
opacity=96
max_results=30
autostart=false

[path]
Add custom search paths here, one per line
~ is your user folder
~\Desktop
C:\Tools

[filetype]
.exe
.lnk
.bat
.ps1

[command]
keyword=cmd
name=命令提示符
action=run:cmd.exe
icon=⚡

[bookmark]
keyword=gh
name=GitHub
url=https://github.com
icon=🔗

[folder]
keyword=desk
name=桌面
path=~\Desktop
icon=📁

[search]
keyword=g
name=Google
url=https://www.google.com/search?q={query}
icon=🔍

[priority]
types=command,bookmark,file,folder,search,search_hint
extensions=.exe,.lnk,.bat,.ps1
custom_path_first=true
